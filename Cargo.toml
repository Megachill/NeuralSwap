[package]
name = "neural-swap"
version = "0.6.1"
edition = "2021"
description = "Native Rust DLSS 5 (Neural Rendering) installer for your games"
license = "MIT"
build = "build.rs"

[[bin]]
name = "NeuralSwap"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
memchr = "2"
once_cell = "1"
rfd = "0.17"
open = "5"
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
flate2 = "1"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
